<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b1633" />
    <title>Page not found | Earthlink Consultants</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #0b1633;
        background: #f7f4ed;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 20% 20%, rgb(173 229 184 / 30%), transparent 34rem), #f7f4ed;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(2rem, 7vw, 4.5rem);
        text-align: center;
        border: 1px solid rgb(11 22 51 / 12%);
        border-radius: 1rem;
        background: rgb(255 255 255 / 78%);
        box-shadow: 0 1.5rem 4rem rgb(11 22 51 / 10%);
      }

      .code {
        margin: 0;
        color: #16794a;
        font:
          700 clamp(4rem, 14vw, 7rem) / 1 Georgia,
          serif;
      }

      h1 {
        margin: 1rem 0 0;
        font:
          600 clamp(1.8rem, 5vw, 2.7rem) / 1.15 Georgia,
          serif;
      }

      p {
        max-width: 34rem;
        margin: 1rem auto 0;
        color: rgb(11 22 51 / 72%);
        line-height: 1.65;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 2rem;
      }

      a {
        min-height: 2.75rem;
        display: inline-flex;
        align-items: center;
        padding: 0.7rem 1.1rem;
        border: 1px solid rgb(11 22 51 / 18%);
        border-radius: 0.4rem;
        color: #0b1633;
        font-weight: 650;
        text-decoration: none;
      }

      a:first-child {
        border-color: #16794a;
        color: white;
        background: #16794a;
      }

      a:focus-visible {
        outline: 3px solid #c99b36;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>
        This link may be old, incomplete or no longer available. Use the links below to continue on
        the Earthlink Consultants website.
      </p>
      <nav aria-label="Page not found options">
        <a href="/">Go to the homepage</a>
        <a href="/partner-universities">Browse universities</a>
        <a href="/contact">Contact Earthlink</a>
      </nav>
    </main>
  </body>
</html>
